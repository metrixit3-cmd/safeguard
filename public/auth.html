<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>Sign in · SAFEGUARD</title><link rel="icon" href="./brand.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"></head><body class="auth-page"><header class="container nav"><a class="brand" href="./index.html"><img src="./brand.svg" alt=""><span>SAFEGUARD</span></a><a href="./index.html" class="button small">Back to home</a></header><main class="container auth-wrap"><section class="card auth-card"><a class="brand" href="./index.html"><img src="./brand.svg" alt=""><span>SAFEGUARD</span></a><div style="margin-top:26px"><span class="eyebrow">Your security account</span><h1 id="authHeading">Welcome back</h1><p class="muted" id="authSub">Sign in to manage your devices.</p></div><div class="tabs" role="tablist"><button class="tab active" type="button" role="tab" aria-selected="true" data-auth="login">Sign in</button><button class="tab" type="button" role="tab" aria-selected="false" data-auth="register">Create account · 30-day trial</button></div><form id="authForm"><div class="field" id="nameField" hidden><label for="authName">Full name</label><input id="authName" name="name" autocomplete="name" maxlength="100" minlength="2"></div><div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="username" required maxlength="254"></div><div class="field" style="margin-top:13px"><label for="authPassword">Password</label><div class="password-field"><input id="authPassword" type="password" autocomplete="current-password" required minlength="10" maxlength="72"><button class="password-toggle" type="button" data-password-toggle="authPassword" aria-label="Show password" aria-pressed="false">◉</button></div></div><div class="field" id="confirmField" hidden style="margin-top:13px"><label for="authConfirmPassword">Confirm password</label><div class="password-field"><input id="authConfirmPassword" type="password" autocomplete="new-password" minlength="10" maxlength="72"><button class="password-toggle" type="button" data-password-toggle="authConfirmPassword" aria-label="Show confirm password" aria-pressed="false">◉</button></div></div><div id="authError" role="alert" class="form-error"></div><button class="button primary" style="width:100%;margin-top:14px" id="authSubmit">Sign in securely</button></form><p class="muted" style="font-size:11px;margin-top:14px">Your account password is bcrypt-hashed on the server. Phone companion sign-in creates a separate device-scoped session.</p><p class="muted" style="font-size:11px;margin-top:10px">Setting up SAFEGUARD operations? <a href="./admin-setup.html" style="color:var(--teal)">Provision the first administrator</a>.</p></section></main><script src="./file-mode-notice.js"></script><script src="./auth.js"></script></body></html>
