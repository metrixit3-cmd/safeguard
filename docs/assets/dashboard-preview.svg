<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">SAFEGUARD customer dashboard preview</title><desc id="desc">Illustrative customer dashboard with live-device status, a 3D map placeholder, security controls and event summary.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101c"/><stop offset="1" stop-color="#101b2a"/></linearGradient><linearGradient id="panel" x2="0" y2="1"><stop stop-color="#17263a"/><stop offset="1" stop-color="#101a2a"/></linearGradient><linearGradient id="map" x2="1" y2="1"><stop stop-color="#153142"/><stop offset="1" stop-color="#263948"/></linearGradient><linearGradient id="teal" x2="1"><stop stop-color="#39d5c7"/><stop offset="1" stop-color="#66dfd3"/></linearGradient><filter id="shadow"><feDropShadow dy="12" stdDeviation="16" flood-color="#000" flood-opacity=".3"/></filter><pattern id="grid" width="150" height="120" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)"><rect x="12" y="12" width="50" height="28" rx="4" fill="#8ba39b" opacity=".24"/><rect x="78" y="14" width="54" height="37" rx="5" fill="#71918c" opacity=".25"/><rect x="20" y="64" width="78" height="41" rx="5" fill="#aec0b2" opacity=".18"/><rect x="111" y="70" width="28" height="32" rx="4" fill="#6b8784" opacity=".36"/></pattern></defs>
  <rect width="1400" height="900" rx="28" fill="url(#bg)"/><rect width="260" height="900" rx="28" fill="#0b1421"/><path d="M260 0v900M260 80h1140" stroke="#ffffff" stroke-opacity=".08"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" fill="#edf3f9"><path d="M35 28h32v36H35z" fill="none" stroke="#43ddce" stroke-width="3"/><path d="m45 46 6 6 12-15" fill="none" stroke="#43ddce" stroke-width="3" stroke-linecap="round"/><text x="79" y="53" font-size="20" font-weight="750" letter-spacing="2">SAFEGUARD</text><text x="32" y="118" font-size="11" font-weight="700" fill="#8394a9" letter-spacing="2">WORKSPACE</text>
    <g font-size="14"><text x="36" y="168" fill="#4cddce">◫　Overview</text><text x="36" y="215" fill="#b3c0cf">▣　My devices</text><text x="36" y="262" fill="#b3c0cf">⌖　Location</text><text x="36" y="309" fill="#b3c0cf">⌁　Theft Mode</text><text x="36" y="356" fill="#b3c0cf">◉　SIM security</text><text x="36" y="403" fill="#b3c0cf">▤　Security events</text><text x="36" y="450" fill="#b3c0cf">♧　Notifications</text><text x="36" y="497" fill="#b3c0cf">◇　Subscription</text><text x="36" y="544" fill="#b3c0cf">⚙　Settings</text></g>
    <rect x="26" y="790" width="208" height="72" rx="14" fill="#111d2d" stroke="#ffffff" stroke-opacity=".09"/><text x="43" y="818" font-size="12" fill="#9baaba">Your account</text><text x="43" y="842" font-size="12" fill="#4cddce">Open phone companion →</text>
    <text x="300" y="48" font-size="23" font-weight="700">Overview</text><rect x="1192" y="24" width="170" height="42" rx="11" fill="#152235" stroke="#ffffff" stroke-opacity=".1"/><text x="1214" y="50" font-size="12" fill="#c6d2df">● Secure session</text>
    <text x="300" y="111" font-size="13" fill="#98a9ba">Your paired devices and their latest reports</text>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g><rect x="300" y="142" width="245" height="113" rx="17" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".1"/><text x="323" y="177" fill="#9aaabd" font-size="12">DEVICES</text><text x="323" y="224" fill="#f1f5fa" font-size="34" font-weight="700">0</text></g>
    <g><rect x="560" y="142" width="245" height="113" rx="17" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".1"/><text x="583" y="177" fill="#9aaabd" font-size="12">PAIRED</text><text x="583" y="224" fill="#f1f5fa" font-size="34" font-weight="700">0</text></g>
    <g><rect x="820" y="142" width="245" height="113" rx="17" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".1"/><text x="843" y="177" fill="#9aaabd" font-size="12">THEFT MODE</text><text x="843" y="224" fill="#f1f5fa" font-size="34" font-weight="700">0</text></g>
    <g><rect x="1080" y="142" width="282" height="113" rx="17" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".1"/><text x="1104" y="177" fill="#9aaabd" font-size="12">TRIAL</text><text x="1104" y="220" fill="#48ddcf" font-size="24" font-weight="700">30 days</text><text x="1233" y="220" fill="#aab8c8" font-size="11">starts at signup</text></g>
    <rect x="300" y="278" width="690" height="380" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".11"/><rect x="314" y="292" width="662" height="352" rx="14" fill="url(#map)"/><rect x="314" y="292" width="662" height="352" rx="14" fill="url(#grid)"/>
  </g>
  <g fill="none" stroke="#d1d9ca" stroke-opacity=".26" stroke-width="14"><path d="m312 438 666-80M316 548l656-94M460 288l72 358M720 289l58 355"/></g><g fill="none" stroke="#68c4b7" stroke-opacity=".42" stroke-width="4" stroke-dasharray="14 13"><path d="M314 599 975 473M870 292v352"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><rect x="333" y="310" width="202" height="31" rx="8" fill="#08131f" fill-opacity=".9"/><text x="348" y="331" fill="#a5f2e9" font-size="10" font-weight="700">3D DARK　 STREET　 SATELLITE</text><rect x="340" y="598" width="306" height="31" rx="8" fill="#07111e" fill-opacity=".89"/><text x="353" y="619" fill="#cbd6e1" font-size="10">Awaiting the first paired-phone GPS report</text>
    <rect x="1010" y="278" width="352" height="380" rx="20" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".11"/><text x="1036" y="316" fill="#eef4fa" font-size="16" font-weight="700">Protection controls</text><text x="1036" y="340" fill="#8fa0b3" font-size="11">Browser-supported settings for paired phones</text>
    <g font-size="12" fill="#dce5ef"><text x="1036" y="389">Theft Mode</text><text x="1036" y="438">Companion siren</text><text x="1036" y="487">GPS sharing</text></g>
    <g><rect x="1282" y="371" width="53" height="27" rx="14" fill="#263448"/><circle cx="1297" cy="384" r="9" fill="#9cabb9"/><rect x="1282" y="420" width="53" height="27" rx="14" fill="#39d5c7" fill-opacity=".38"/><circle cx="1320" cy="433" r="9" fill="url(#teal)"/><rect x="1282" y="469" width="53" height="27" rx="14" fill="#39d5c7" fill-opacity=".38"/><circle cx="1320" cy="482" r="9" fill="url(#teal)"/></g>
    <rect x="1010" y="681" width="352" height="153" rx="18" fill="url(#panel)" stroke="#ffffff" stroke-opacity=".11"/><text x="1036" y="718" fill="#edf3f9" font-size="15" font-weight="700">Recent security activity</text><circle cx="1043" cy="754" r="4" fill="#44d5c7"/><text x="1056" y="758" fill="#b9c6d4" font-size="11">No device reports yet</text><text x="1056" y="783" fill="#8495a9" font-size="10">Pair your phone to begin</text>
    <text x="300" y="714" fill="#48dbce" font-size="12" font-weight="700">LOCATION MAP</text><text x="300" y="740" fill="#a5b2c1" font-size="11">Displays reported GPS only; no demo device position is fabricated.</text>
  </g>
  <text x="300" y="870" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" fill="#8292a5">Illustrative UI preview · counts and map are placeholders, not live account data.</text>
</svg>
