<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" role="img" aria-labelledby="title desc">
  <title id="title">SAFEGUARD phone companion preview</title><desc id="desc">Illustrative phone screen showing linked status, permissioned GPS sharing and browser Theft Mode alert controls.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#08111e"/><stop offset="1" stop-color="#15243a"/></linearGradient><linearGradient id="screen" x2="0" y2="1"><stop stop-color="#111f31"/><stop offset="1" stop-color="#0b1421"/></linearGradient><linearGradient id="teal" x2="1"><stop stop-color="#3bd7c9"/><stop offset="1" stop-color="#75e8db"/></linearGradient><filter id="shadow"><feDropShadow dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter></defs>
  <rect width="900" height="680" rx="28" fill="url(#bg)"/><circle cx="705" cy="135" r="170" fill="#2a877f" opacity=".12"/><circle cx="730" cy="550" r="190" fill="#335578" opacity=".12"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="58" y="96" fill="#48dfd0" font-size="13" font-weight="700" letter-spacing="3">PHONE COMPANION</text><text x="58" y="161" fill="#f2f5fa" font-size="38" font-weight="750">One account.</text><text x="58" y="207" fill="#f2f5fa" font-size="38" font-weight="750">A paired phone.</text><text x="58" y="261" fill="#aab8c8" font-size="17">Sign in on your phone. Grant location</text><text x="58" y="288" fill="#aab8c8" font-size="17">permission and keep the page active to share GPS.</text>
    <rect x="58" y="337" width="333" height="80" rx="16" fill="#14243a" stroke="#ffffff" stroke-opacity=".11"/><circle cx="91" cy="377" r="15" fill="#37d1c3" fill-opacity=".18"/><circle cx="91" cy="377" r="7" fill="#4ce1d2"/><text x="120" y="371" fill="#48dfd0" font-size="11" font-weight="700" letter-spacing="2">GPS SHARING</text><text x="120" y="394" fill="#e7eef5" font-size="14" font-weight="650">Permissioned · page active</text>
    <rect x="58" y="435" width="333" height="80" rx="16" fill="#14243a" stroke="#ffffff" stroke-opacity=".11"/><path d="M81 468h18v24H81zM85 463h10v4H85z" fill="none" stroke="#54ded0" stroke-width="2"/><text x="120" y="469" fill="#48dfd0" font-size="11" font-weight="700" letter-spacing="2">THEFT MODE</text><text x="120" y="492" fill="#e7eef5" font-size="14" font-weight="650">On-screen alert while connected</text>
    <text x="58" y="576" fill="#8fa0b2" font-size="12">Browser companion only · does not lock the phone OS.</text><text x="58" y="600" fill="#8fa0b2" font-size="12">Background tracking can be suspended by the phone.</text></g>
  <g filter="url(#shadow)"><rect x="490" y="40" width="315" height="600" rx="42" fill="#05090f" stroke="#53657a" stroke-width="2"/><rect x="505" y="56" width="285" height="568" rx="31" fill="url(#screen)"/><rect x="592" y="66" width="110" height="18" rx="9" fill="#05090f"/><text x="530" y="113" fill="#edf3f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="750" letter-spacing="2">SAFEGUARD</text><circle cx="744" cy="108" r="5" fill="#40d3c5"/>
    <text x="530" y="174" fill="#48dfd0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">YOUR PHONE COMPANION</text><text x="530" y="212" fill="#f2f5fa" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="750">Connected</text>
    <rect x="525" y="236" width="245" height="84" rx="14" fill="#15263b" stroke="#ffffff" stroke-opacity=".09"/><rect x="541" y="252" width="34" height="42" rx="8" fill="#23384d"/><rect x="551" y="259" width="14" height="25" rx="3" fill="#45d8ca"/><text x="589" y="265" fill="#edf3f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="650">My Android phone</text><text x="589" y="288" fill="#9aabbd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Linked to your account</text>
    <text x="530" y="359" fill="#edf3f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700">GPS sharing</text><text x="530" y="382" fill="#9aaabd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Updates while this page is active</text><rect x="530" y="398" width="153" height="43" rx="11" fill="url(#teal)"/><text x="554" y="425" fill="#052127" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">Stop sharing</text><circle cx="540" cy="461" r="4" fill="#47dccc"/><text x="552" y="465" fill="#b5c3d0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Latest report sent</text>
    <path d="M530 486h235" stroke="#ffffff" stroke-opacity=".09"/><text x="530" y="519" fill="#edf3f9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700">Theft alert &amp; siren</text><text x="530" y="542" fill="#9aaabd" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Enable audio with a tap before an alert.</text><rect x="530" y="558" width="153" height="40" rx="10" fill="#17283c" stroke="#ffffff" stroke-opacity=".12"/><text x="554" y="583" fill="#e4edf5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650">Enable alarm audio</text></g>
</svg>
